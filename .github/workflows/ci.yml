name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : la CI lit le code, elle n'écrit rien sur le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Lint (ruff)
        run: pip install ruff==0.14.0 && ruff check .
      - name: Installation
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -t .
      # Failles ChromaDB ignorées : elles visent son mode serveur HTTP, que ce projet n'utilise pas
      # (PersistentClient local, sans serveur), et aucune version corrigée n'existe. À revoir si
      # un serveur Chroma est un jour exposé.
      - name: Audit des dépendances
        run: >-
          pip install pip-audit==2.9.0 && pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
